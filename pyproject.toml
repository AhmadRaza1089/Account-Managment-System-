[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-manager"
version = "0.2.0"
description = "Self-hosted company income, expense and approval tracking, with an MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["accounting", "expenses", "mcp", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.0,<10.0"]
postgres = ["psycopg[binary]>=3.1,<4.0"]
# AI features are optional. Ollama needs no package at all — just a local
# Ollama server — so there is no extra for it.
claude = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.5,<1.0", "mypy>=1.10,<2.0"]

[project.scripts]
account-manager = "account_manager.cli:main"

[tool.setuptools]
packages = ["account_manager", "account_manager.ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
